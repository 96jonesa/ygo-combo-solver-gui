# Packaging (TDD §13). Solver artifacts ride as extraResources so the main
# process finds them at <resourcesPath>/solver/<platform>/ — the packaged
# branch of bundledSolverPath — and each carries the solver's LICENSE/NOTICE
# next to the binary (AGPL compliance, PRD §9).
appId: io.github.96jonesa.ygo-combo-solver-gui
productName: YGO Combo Solver
directories:
  output: dist
files:
  - out/**
  - package.json
  - LICENSE
  - NOTICE
npmRebuild: false
# Publishing is owned by the release workflow (draft release via
# softprops/action-gh-release); electron-builder must never auto-publish,
# which it otherwise attempts on CI and fails wanting a token.
publish: null

mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.utilities
  # AD-HOC signed: `"-"` signs the whole bundle (including the bundled solver)
  # with no identity. NOT the same as `null`, which skips signing entirely —
  # that shipped in v0.1.0 and v0.2.0: the bundle kept the stock Electron
  # binary's signature, which no longer matched the renamed, repacked app, so
  # every downloaded (quarantined) copy was reported "damaged" on arm64 Macs.
  # The release workflow runs `codesign --verify --deep --strict` on the built
  # app and fails if it does not hold.
  #
  # Ad-hoc is not a Developer ID: a downloaded copy still needs one approval on
  # first launch (docs/INSTALL.md). Developer ID + notarization is YGO-11.
  identity: "-"
  # Off: the hardened runtime only matters for notarization, and with an ad-hoc
  # signature library validation can refuse Electron's own framework at launch.
  hardenedRuntime: false
  extraResources:
    - from: resources/solver/mac
      to: solver/mac

win:
  target:
    - target: nsis
      arch: [x64]
  extraResources:
    - from: resources/solver/win
      to: solver/win

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  license: LICENSE
